[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "msc-unlearning"
version = "1.0.0"
description = "Machine unlearning evaluation framework for identity-level deletion on synthetic facial data"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "Faiz Palwala"},
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "torch>=2.0",
    "torchvision>=0.15",
    "numpy>=1.24,<2",
    "pandas>=2.0",
    "scikit-learn>=1.5",
    "matplotlib>=3.7",
    "pyyaml>=6.0",
    "pillow>=10.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "black>=23.0",
]

[project.scripts]
train-model = "train:main"
single-shot = "single_shot:main"
iterative = "iterative:main"

[tool.setuptools]
# Flat module layout: src/*.py are top-level modules (no __init__.py).
package-dir = {"" = "src"}
py-modules = [
    "ablation_study",
    "baselines",
    "canary",
    "config_loader",
    "dataset",
    "device_utils",
    "evaluate",
    "hparam_search",
    "interfaces",
    "iterative",
    "mia",
    "model",
    "novel_variant",
    "probes",
    "report",
    "single_shot",
    "sota_methods",
    "stability",
    "train",
]
